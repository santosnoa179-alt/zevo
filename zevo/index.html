<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- App privée — noindex pour éviter la duplication avec la landing
         officielle zevo-one.com (Next.js). Toutes les métadonnées marketing
         et le JSON-LD (SoftwareApplication, FAQPage, Organization) vivent
         sur zevo-one.com uniquement. -->
    <title>Zevo</title>
    <meta name="description" content="Accède à ton espace Zevo." />
    <meta name="author" content="Zevo" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph minimal pour le partage de liens d'invitation -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zevo" />
    <meta property="og:description" content="Ton espace coach / client Zevo." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Zevo" />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#060606" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zevo" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Preconnect aux APIs externes -->
    <link rel="preconnect" href="https://pairqvridvjdktnuvwud.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://pairqvridvjdktnuvwud.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
    <link rel="dns-prefetch" href="https://js.stripe.com" />
  </head>
  <body>
    <!-- Splash screen inline — visible instantanement pendant le chargement JS -->
    <div id="root">
      <div id="splash" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#060606;">
        <svg width="48" height="48" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="animation:pulse 1.5s ease-in-out infinite">
          <rect width="40" height="40" rx="10" fill="#FF5C1A"/>
          <path d="M10 13h20M10 20h20M10 27h20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <style>@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}</style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
