<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF5C1A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060606" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5C1A"/>
      <stop offset="100%" stop-color="#FF7A42"/>
    </linearGradient>
    <linearGradient id="textfade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F3"/>
      <stop offset="100%" stop-color="#F5F5F3" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#060606"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(72)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(144)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(216)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(288)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(360)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(432)"/>
    <line x1="0" y1="630" x2="1200" y2="630" transform="translate(0,-72)"/>
    <line x1="0" y1="630" x2="1200" y2="630" transform="translate(0,-144)"/>
    <line x1="0" y1="630" x2="1200" y2="630" transform="translate(0,-216)"/>
    <line x1="0" y1="630" x2="1200" y2="630" transform="translate(0,-288)"/>
    <line x1="0" y1="630" x2="1200" y2="630" transform="translate(0,-360)"/>
  </g>

  <!-- Logo icon -->
  <g transform="translate(80, 60)">
    <rect width="44" height="44" rx="10" fill="url(#orange)"/>
    <rect x="10" y="12" width="24" height="4" rx="2" fill="white"/>
    <rect x="10" y="20" width="24" height="4" rx="2" fill="white"/>
    <rect x="10" y="28" width="24" height="4" rx="2" fill="white"/>
  </g>

  <!-- Zevo wordmark -->
  <text x="136" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#F5F5F3">Zevo</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="url(#textfade)">Le logiciel coach sportif</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="url(#orange)">tout-en-un</text>

  <!-- Subtitle -->
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#F5F5F3" opacity="0.4">Suivi client · Programmes · Nutrition · Paiements · Messagerie</text>

  <!-- CTA badge -->
  <g transform="translate(80, 420)">
    <rect width="280" height="48" rx="24" fill="url(#orange)"/>
    <text x="140" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Essai gratuit 14 jours</text>
  </g>

  <!-- Stats row -->
  <g transform="translate(80, 520)" font-family="system-ui, -apple-system, sans-serif">
    <text x="0" y="0" font-size="28" font-weight="700" fill="#FF5C1A">500+</text>
    <text x="0" y="22" font-size="12" fill="#F5F5F3" opacity="0.3">coachs en France</text>

    <text x="200" y="0" font-size="28" font-weight="700" fill="#FF5C1A">4.8/5</text>
    <text x="200" y="22" font-size="12" fill="#F5F5F3" opacity="0.3">satisfaction</text>

    <text x="400" y="0" font-size="28" font-weight="700" fill="#FF5C1A">98%</text>
    <text x="400" y="22" font-size="12" fill="#F5F5F3" opacity="0.3">retention</text>
  </g>

  <!-- Right side — mini dashboard mockup -->
  <g transform="translate(700, 120)">
    <!-- Browser frame -->
    <rect width="440" height="380" rx="16" fill="#0c0c0c" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
    <!-- Title bar -->
    <rect width="440" height="36" rx="16" fill="#111111"/>
    <rect y="20" width="440" height="16" fill="#111111"/>
    <circle cx="20" cy="18" r="4" fill="#FF5F57"/>
    <circle cx="34" cy="18" r="4" fill="#FEBC2E"/>
    <circle cx="48" cy="18" r="4" fill="#28C840"/>
    <!-- URL bar -->
    <rect x="140" y="10" width="160" height="16" rx="4" fill="white" fill-opacity="0.03"/>
    <text x="220" y="22" font-family="monospace" font-size="8" fill="#F5F5F3" fill-opacity="0.2" text-anchor="middle">app.zevo.coach</text>

    <!-- Dashboard content -->
    <text x="20" y="64" font-family="system-ui" font-size="14" font-weight="700" fill="#F5F5F3">Bonjour, Coach</text>
    <text x="20" y="80" font-family="system-ui" font-size="9" fill="#F5F5F3" fill-opacity="0.25">Mercredi 9 Avril 2026</text>

    <!-- Stat cards -->
    <g transform="translate(20, 95)">
      <rect width="95" height="60" rx="8" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.04"/>
      <text x="10" y="25" font-family="system-ui" font-size="18" font-weight="700" fill="#F5F5F3">24</text>
      <text x="10" y="42" font-family="system-ui" font-size="8" fill="#F5F5F3" fill-opacity="0.25">Clients</text>
      <text x="75" y="16" font-family="system-ui" font-size="7" font-weight="700" fill="#10B981">+3</text>
    </g>
    <g transform="translate(125, 95)">
      <rect width="95" height="60" rx="8" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.04"/>
      <text x="10" y="25" font-family="system-ui" font-size="18" font-weight="700" fill="#F5F5F3">67</text>
      <text x="10" y="42" font-family="system-ui" font-size="8" fill="#F5F5F3" fill-opacity="0.25">Seances</text>
      <text x="70" y="16" font-family="system-ui" font-size="7" font-weight="700" fill="#10B981">+12%</text>
    </g>
    <g transform="translate(230, 95)">
      <rect width="95" height="60" rx="8" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.04"/>
      <text x="10" y="25" font-family="system-ui" font-size="18" font-weight="700" fill="#F5F5F3">94%</text>
      <text x="10" y="42" font-family="system-ui" font-size="8" fill="#F5F5F3" fill-opacity="0.25">Retention</text>
      <text x="75" y="16" font-family="system-ui" font-size="7" font-weight="700" fill="#10B981">+2%</text>
    </g>
    <g transform="translate(335, 95)">
      <rect width="85" height="60" rx="8" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.04"/>
      <text x="10" y="25" font-family="system-ui" font-size="15" font-weight="700" fill="#F5F5F3">3240</text>
      <text x="10" y="42" font-family="system-ui" font-size="8" fill="#F5F5F3" fill-opacity="0.25">Revenu</text>
      <text x="66" y="16" font-family="system-ui" font-size="7" font-weight="700" fill="#10B981">+18%</text>
    </g>

    <!-- Chart area -->
    <g transform="translate(20, 175)">
      <rect width="280" height="100" rx="8" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.04"/>
      <text x="10" y="18" font-family="system-ui" font-size="8" font-weight="600" fill="#F5F5F3" fill-opacity="0.3">Progression · 12 mois</text>
      <!-- Bar chart -->
      <g transform="translate(10, 30)">
        <rect x="0" y="45" width="16" height="25" rx="2" fill="#FF5C1A" fill-opacity="0.4"/>
        <rect x="20" y="35" width="16" height="35" rx="2" fill="#FF5C1A" fill-opacity="0.5"/>
        <rect x="40" y="40" width="16" height="30" rx="2" fill="#FF5C1A" fill-opacity="0.45"/>
        <rect x="60" y="25" width="16" height="45" rx="2" fill="#FF5C1A" fill-opacity="0.6"/>
        <rect x="80" y="30" width="16" height="40" rx="2" fill="#FF5C1A" fill-opacity="0.55"/>
        <rect x="100" y="18" width="16" height="52" rx="2" fill="#FF5C1A" fill-opacity="0.7"/>
        <rect x="120" y="22" width="16" height="48" rx="2" fill="#FF5C1A" fill-opacity="0.65"/>
        <rect x="140" y="10" width="16" height="60" rx="2" fill="#FF5C1A" fill-opacity="0.8"/>
        <rect x="160" y="15" width="16" height="55" rx="2" fill="#FF5C1A" fill-opacity="0.75"/>
        <rect x="180" y="5" width="16" height="65" rx="2" fill="#FF5C1A" fill-opacity="0.85"/>
        <rect x="200" y="8" width="16" height="62" rx="2" fill="#FF5C1A" fill-opacity="0.8"/>
        <rect x="220" y="0" width="16" height="70" rx="2" fill="#FF5C1A"/>
      </g>
    </g>

    <!-- Activity feed -->
    <g transform="translate(310, 175)">
      <rect width="110" height="100" rx="8" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.04"/>
      <text x="10" y="18" font-family="system-ui" font-size="8" font-weight="600" fill="#F5F5F3" fill-opacity="0.3">Activite</text>
      <circle cx="16" cy="38" r="3" fill="#10B981"/>
      <text x="24" y="41" font-family="system-ui" font-size="7" fill="#F5F5F3" fill-opacity="0.35">Seance validee</text>
      <circle cx="16" cy="56" r="3" fill="#FF5C1A"/>
      <text x="24" y="59" font-family="system-ui" font-size="7" fill="#F5F5F3" fill-opacity="0.35">Nouveau prospect</text>
      <circle cx="16" cy="74" r="3" fill="#F59E0B"/>
      <text x="24" y="77" font-family="system-ui" font-size="7" fill="#F5F5F3" fill-opacity="0.35">Paiement 49E</text>
    </g>
  </g>

  <!-- Glow under mockup -->
  <ellipse cx="920" cy="520" rx="250" ry="60" fill="#FF5C1A" fill-opacity="0.06" filter="url(#blur)"/>
</svg>
