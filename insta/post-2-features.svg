<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="orangeGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B2B"/>
      <stop offset="100%" stop-color="#FF9A6C"/>
    </linearGradient>
    <clipPath id="logoClip2">
      <polygon points="0,0 88,0 88,61.6 61.6,88 0,88"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1080" fill="url(#bgGrad2)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="270" x2="1080" y2="270" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="540" x2="1080" y2="540" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="810" x2="1080" y2="810" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="1080" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="1080" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Logo top left -->
  <g transform="translate(60, 50) scale(0.7)">
    <rect width="88" height="88" rx="18" fill="#FF6B2B" clip-path="url(#logoClip2)"/>
    <rect x="12" y="12" width="64" height="11" fill="white"/>
    <polygon points="71,23 76,12 17,44 12,44" fill="white"/>
    <rect x="12" y="44" width="64" height="11" fill="white"/>
    <polygon points="12,55 17,44 76,75 71,75" fill="white"/>
    <rect x="12" y="65" width="64" height="11" fill="white"/>
  </g>
  <text x="135" y="96" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="32" fill="white" letter-spacing="2">ZEVO</text>

  <!-- Headline -->
  <text x="540" y="210" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="56" fill="white" letter-spacing="-1">TOUT CE DONT</text>
  <text x="540" y="275" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="56" fill="white" letter-spacing="-1">UN COACH A <tspan fill="#FF6B2B">BESOIN</tspan></text>

  <!-- Feature cards - 2x3 grid -->
  <!-- Card 1 - Sport -->
  <rect x="60" y="340" width="460" height="155" rx="20" fill="#1E1E1E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="85" y="370" width="48" height="48" rx="14" fill="#FF6B2B" fill-opacity="0.12"/>
  <text x="101" y="402" font-family="Arial, sans-serif" font-size="24" fill="#FF6B2B">🏋️</text>
  <text x="150" y="393" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="white">Programmes Sport</text>
  <text x="85" y="440" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">Cree des programmes multi-</text>
  <text x="85" y="462" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">semaines avec exercices et series</text>

  <!-- Card 2 - Nutrition -->
  <rect x="560" y="340" width="460" height="155" rx="20" fill="#1E1E1E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="585" y="370" width="48" height="48" rx="14" fill="#22c55e" fill-opacity="0.12"/>
  <text x="601" y="402" font-family="Arial, sans-serif" font-size="24" fill="#22c55e">🥗</text>
  <text x="650" y="393" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="white">Plans Nutrition</text>
  <text x="585" y="440" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">Macros, repas personnalises,</text>
  <text x="585" y="462" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">suivi alimentaire complet</text>

  <!-- Card 3 - Calendrier -->
  <rect x="60" y="520" width="460" height="155" rx="20" fill="#1E1E1E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="85" y="550" width="48" height="48" rx="14" fill="#3b82f6" fill-opacity="0.12"/>
  <text x="101" y="582" font-family="Arial, sans-serif" font-size="24" fill="#3b82f6">📅</text>
  <text x="150" y="573" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="white">Calendrier</text>
  <text x="85" y="620" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">Reservation en ligne, dispos</text>
  <text x="85" y="642" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">automatiques, rappels clients</text>

  <!-- Card 4 - Paiements -->
  <rect x="560" y="520" width="460" height="155" rx="20" fill="#1E1E1E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="585" y="550" width="48" height="48" rx="14" fill="#f59e0b" fill-opacity="0.12"/>
  <text x="601" y="582" font-family="Arial, sans-serif" font-size="24" fill="#f59e0b">💳</text>
  <text x="650" y="573" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="white">Paiements</text>
  <text x="585" y="620" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">Stripe Connect integre, offres,</text>
  <text x="585" y="642" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">abonnements et factures auto</text>

  <!-- Card 5 - Suivi -->
  <rect x="60" y="700" width="460" height="155" rx="20" fill="#1E1E1E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="85" y="730" width="48" height="48" rx="14" fill="#a855f7" fill-opacity="0.12"/>
  <text x="101" y="762" font-family="Arial, sans-serif" font-size="24" fill="#a855f7">📊</text>
  <text x="150" y="753" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="white">Suivi Client 360°</text>
  <text x="85" y="800" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">Poids, humeur, sommeil, sport,</text>
  <text x="85" y="822" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">habitudes — tout en un seul hub</text>

  <!-- Card 6 - Messages -->
  <rect x="560" y="700" width="460" height="155" rx="20" fill="#1E1E1E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="585" y="730" width="48" height="48" rx="14" fill="#ec4899" fill-opacity="0.12"/>
  <text x="601" y="762" font-family="Arial, sans-serif" font-size="24" fill="#ec4899">💬</text>
  <text x="650" y="753" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="white">Messagerie</text>
  <text x="585" y="800" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">Chat integre avec tes clients,</text>
  <text x="585" y="822" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.5)">messages vocaux et fichiers</text>

  <!-- Bottom CTA -->
  <rect x="310" y="910" width="460" height="56" rx="28" fill="url(#orangeGrad2)"/>
  <text x="540" y="946" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="white">Commence gratuitement →</text>

  <text x="540" y="1030" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(245,245,243,0.3)">zevo-one.vercel.app</text>
</svg>
