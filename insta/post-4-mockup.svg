  <rect x="610" y="545" width="260" height="155" rx="14" fill="#FF6B2B" fill-opacity="0.15"/>
  <rect x="622" y="557" width="236" height="110" rx="8" fill="#2A2A2A"/>
  <text x="700" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(245,245,243,0.3)">📄 Programme Semaine 9.pdf</text>
  <text x="700" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(245,245,243,0.2)">Partage de fichier</text>
  <text x="625" y="690" font-family="Arial, sans-serif" font-size="13" fill="rgba(245,245,243,0.8)">Voila ton programme !</text>

