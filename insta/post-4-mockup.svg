  <text x="540" y="170" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="48" fill="white" letter-spacing="-1">GERE TES CLIENTS</text>
  <text x="540" y="230" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="48" fill="white" letter-spacing="-1">COMME UN <tspan fill="#FF6B2B">PRO</tspan></text>

  <!-- Phone mockup - Client Profile view -->
  <rect x="80" y="290" width="420" height="720" rx="36" fill="#1E1E1E" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

