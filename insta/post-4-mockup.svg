  <circle cx="635" cy="785" r="12" fill="#FF6B2B"/>
  <polygon points="631,780 631,790 641,785" fill="white"/>
  <rect x="660" y="781" width="8" height="8" rx="2" fill="rgba(245,245,243,0.4)"/>
  <rect x="672" y="778" width="8" height="14" rx="2" fill="rgba(245,245,243,0.4)"/>
  <rect x="684" y="780" width="8" height="10" rx="2" fill="rgba(245,245,243,0.4)"/>
  <rect x="696" y="776" width="8" height="18" rx="2" fill="rgba(245,245,243,0.4)"/>
  <rect x="708" y="782" width="8" height="6" rx="2" fill="rgba(245,245,243,0.4)"/>
  <rect x="720" y="779" width="8" height="12" rx="2" fill="rgba(245,245,243,0.4)"/>
  <text x="790" y="790" font-family="Arial, sans-serif" font-size="11" fill="rgba(245,245,243,0.3)">0:12</text>

  <!-- Chat input -->
  <rect x="600" y="915" width="380" height="45" rx="22" fill="#2A2A2A"/>
  <text x="625" y="943" font-family="Arial, sans-serif" font-size="14" fill="rgba(245,245,243,0.3)">Message...</text>
  <circle cx="950" cy="937" r="16" fill="#FF6B2B"/>
  <polygon points="945,932 945,942 955,937" fill="white"/>

