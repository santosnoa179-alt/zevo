  <text x="650" y="396" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">En ligne</text>

  <!-- Chat messages -->
  <!-- Coach message -->
  <rect x="610" y="430" width="260" height="50" rx="14" fill="#FF6B2B" fill-opacity="0.15"/>
  <text x="625" y="452" font-family="Arial, sans-serif" font-size="13" fill="rgba(245,245,243,0.8)">Super seance aujourd'hui !</text>
  <text x="625" y="470" font-family="Arial, sans-serif" font-size="13" fill="rgba(245,245,243,0.8)">On augmente les charges ? 💪</text>

