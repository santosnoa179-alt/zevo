  <rect x="720" y="715" width="260" height="35" rx="14" fill="#2A2A2A"/>
  <text x="735" y="738" font-family="Arial, sans-serif" font-size="13" fill="rgba(245,245,243,0.8)">Merci coach ! 🙏</text>

