  <text x="245" y="520" font-family="Arial, sans-serif" font-size="11" fill="rgba(245,245,243,0.5)">Seances</text>
  <text x="245" y="548" font-family="Arial, sans-serif" font-weight="800" font-size="24" fill="#FF6B2B">24</text>

  <rect x="360" y="495" width="120" height="70" rx="12" fill="#2A2A2A"/>
  <text x="375" y="520" font-family="Arial, sans-serif" font-size="11" fill="rgba(245,245,243,0.5)">Humeur</text>
  <text x="375" y="548" font-family="Arial, sans-serif" font-weight="800" font-size="24" fill="#f59e0b">😊</text>

