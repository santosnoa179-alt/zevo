  <text x="125" y="846" font-family="Arial, sans-serif" font-size="16" fill="#22c55e">🥗</text>
  <text x="160" y="841" font-family="Arial, sans-serif" font-weight="600" font-size="14" fill="white">Plan Nutrition - Seche</text>
  <text x="160" y="858" font-family="Arial, sans-serif" font-size="11" fill="rgba(245,245,243,0.4)">2100 kcal · P180 G210 L65</text>

