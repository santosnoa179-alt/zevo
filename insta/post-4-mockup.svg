  <rect x="310" y="1010" width="460" height="40" rx="20" fill="url(#orangeGrad4)" fill-opacity="0.8"/>
  <text x="540" y="1037" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="18" fill="white">zevo-one.vercel.app</text>
