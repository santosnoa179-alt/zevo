  <rect x="210" y="445" width="60" height="22" rx="11" fill="#22c55e" fill-opacity="0.15"/>
  <text x="225" y="460" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#22c55e">Actif</text>

