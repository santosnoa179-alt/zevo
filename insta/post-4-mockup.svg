  <text x="115" y="520" font-family="Arial, sans-serif" font-size="11" fill="rgba(245,245,243,0.5)">Poids</text>
  <text x="115" y="548" font-family="Arial, sans-serif" font-weight="800" font-size="24" fill="white">78.5</text>
  <text x="175" y="548" font-family="Arial, sans-serif" font-size="13" fill="rgba(245,245,243,0.4)">kg</text>

