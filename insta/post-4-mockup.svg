<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="orangeGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B2B"/>
      <stop offset="100%" stop-color="#FF9A6C"/>
    </linearGradient>
    <linearGradient id="glowGrad4" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#FF6B2B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF6B2B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="logoClip4">
      <polygon points="0,0 88,0 88,61.6 61.6,88 0,88"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1080" fill="url(#bgGrad4)"/>

  <!-- Bottom glow -->
  <ellipse cx="540" cy="1080" rx="700" ry="400" fill="url(#glowGrad4)"/>

  <!-- Logo top left -->
  <g transform="translate(60, 50) scale(0.7)">
    <rect width="88" height="88" rx="18" fill="#FF6B2B" clip-path="url(#logoClip4)"/>
    <rect x="12" y="12" width="64" height="11" fill="white"/>
    <polygon points="71,23 76,12 17,44 12,44" fill="white"/>
    <rect x="12" y="44" width="64" height="11" fill="white"/>
    <polygon points="12,55 17,44 76,75 71,75" fill="white"/>
    <rect x="12" y="65" width="64" height="11" fill="white"/>
  </g>
  <text x="135" y="96" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="32" fill="white" letter-spacing="2">ZEVO</text>

