  <rect x="115" y="749" width="32" height="32" rx="8" fill="#FF6B2B" fill-opacity="0.12"/>
  <text x="125" y="771" font-family="Arial, sans-serif" font-size="16" fill="#FF6B2B">🏋️</text>
