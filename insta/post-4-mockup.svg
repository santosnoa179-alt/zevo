  <text x="150" y="428" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="white">L</text>
  <text x="210" y="405" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="white">Lucas Martin</text>
